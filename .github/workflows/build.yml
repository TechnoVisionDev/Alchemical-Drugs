name: build
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Alchemical-Drugs
      - uses: actions/checkout@v4
        with:
          repository: SmashingMods/ChemLib-Fabric
          ref: 99e4088cbf19a8a863be8f2b61ef7d9feca9f15c
          path: ChemLib-Fabric
      - uses: actions/checkout@v4
        with:
          repository: SmashingMods/Alchemistry-Fabric
          ref: 5e7f6139ff632a2fed8a754b36fc2b254bc4f4d9
          path: Alchemistry-Fabric
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build companion chemistry ports
        run: |
          bash ChemLib-Fabric/gradlew -p ChemLib-Fabric assemble
          bash Alchemistry-Fabric/gradlew -p Alchemistry-Fabric assemble -Pchemlib_jar="$GITHUB_WORKSPACE/ChemLib-Fabric/build/libs/ChemLib-1.0.2+mc26.2.jar"
      - name: Build addon and run server tests
        working-directory: Alchemical-Drugs
        run: bash gradlew build -Palchemistry_jar="$GITHUB_WORKSPACE/Alchemistry-Fabric/build/libs/Alchemistry-1.0.3+mc26.2.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: AlchemicalDrugs-26.2
          path: Alchemical-Drugs/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: Alchemical-Drugs/build/run/gameTest/logs/
