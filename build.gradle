plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}
version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }

def chemLibJar = file(providers.gradleProperty('chemlib_jar').getOrElse('../ChemLib-Fabric/build/libs/ChemLib-1.0.2+mc26.2.jar'))
def alchemistryJar = file(providers.gradleProperty('alchemistry_jar').getOrElse('../Alchemistry-Fabric/build/libs/Alchemistry-1.0.3+fabric-26.2.jar'))
[chemLibJar, alchemistryJar].each {
    if (!it.exists()) throw new GradleException("Missing 26.2 dependency: ${it}. See README.md for build instructions.")
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation files(chemLibJar, alchemistryJar)
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'alchemicaldrugs-test'
        enableGameTests = true
        enableClientGameTests = true
    }
}
